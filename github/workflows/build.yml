name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Quran text (bundled inside the app for offline use)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 5 --retry-delay 5 https://api.alquran.cloud/v1/quran/quran-uthmani -o app/src/main/assets/quran.json
          python3 - <<'PY'
          import json
          d = json.load(open('app/src/main/assets/quran.json', encoding='utf-8'))['data']['surahs']
          assert len(d) == 114, len(d)
          assert sum(len(s['ayahs']) for s in d) == 6236
          print('Quran OK: 114 surahs, 6236 ayahs')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk prayer-alarm.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" prayer-alarm.apk \
            --title "منبه الصلاة v${{ github.run_number }}" \
            --notes "نزّل ملف prayer-alarm.apk وثبّته على تليفون أندرويد. التطبيق بيشتغل بدون إنترنت."
